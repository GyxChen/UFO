[package]
name = "tauri-app"
version = "2.10.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
repository = "https://github.com/Uninen/tauri-vue-template"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-prevent-default = "5.0"
# 代理解析：只读打开 cc-switch 的 SQLite 库。bundled 自带 SQLite，免依赖系统库。
rusqlite = { version = "0.32", features = ["bundled"] }
# 信息卡拓展（用户自写流程）：内嵌 QuickJS 作脚本沙盒。
# 只开必要 feature —— `parallel` 让 Runtime 能跨线程持有（脚本跑在专用 worker 线程），
# `classes`/`properties` 用于把宿主对象挂到 global。刻意不开 `loader`/`dyn-load`：
# 沙盒不允许脚本读文件或其它模块。
rquickjs = { version = "0.13", default-features = false, features = ["std", "parallel", "classes", "properties"] }
# 脚本的 http API：Rust 侧代发请求（渲染进程受 CSP `connect-src` 限制无法直连外网）。
ureq = "3"
# 脚本要用的第三方 API key 存 OS 凭据管理器（Windows = Credential Manager），不落盘。
keyring = "4"

# 悬浮窗贴边：轮询物理鼠标左键状态（GetAsyncKeyState），绕开 Windows 原生拖拽吞 pointerup 的问题。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.
