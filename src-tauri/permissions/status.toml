[[permission]]
identifier = "allow-get-status-snapshot"
description = "Allows reading the normalized agent status snapshot."
commands.allow = ["get_status_snapshot"]

[[permission]]
identifier = "allow-get-proxy-resolvers"
description = "Allows listing available proxy resolvers for the settings dropdown."
commands.allow = ["get_proxy_resolvers"]

[[permission]]
identifier = "allow-get-floating-module-config"
description = "Allows reading floating window module configuration."
commands.allow = ["get_floating_module_config"]

[[permission]]
identifier = "allow-set-floating-module-config"
description = "Allows updating validated floating window module configuration."
commands.allow = ["set_floating_module_config"]

[[permission]]
identifier = "allow-get-endpoint-profiles"
description = "Allows reading the persisted endpoint profile list (信息卡拓展)."
commands.allow = ["get_endpoint_profiles"]

[[permission]]
identifier = "allow-manage-endpoint-profiles"
description = "Allows adding and deleting endpoint profiles from the main window."
commands.allow = ["add_endpoint_profile", "delete_endpoint_profile"]

[[permission]]
identifier = "allow-get-session-records"
description = "Allows reading the persisted agent session record list (会话记录)."
commands.allow = ["get_session_records"]

[[permission]]
identifier = "allow-manage-session-records"
description = "Allows deleting or clearing persisted session records from the main window."
commands.allow = ["delete_session_record", "clear_session_records"]

[[permission]]
identifier = "allow-get-flow-results"
description = "Allows reading flow-script extension fields for tooltips (信息卡拓展流程脚本)."
commands.allow = ["get_flow_results", "get_flow_snapshot"]

[[permission]]
identifier = "allow-save-endpoint-flow"
description = "Allows saving a per-endpoint flow script config from the main window."
commands.allow = ["save_endpoint_flow"]

[[permission]]
identifier = "allow-run-flow-test"
description = "Allows running a flow script once for preview from the main window."
commands.allow = ["run_flow_test"]

[[permission]]
identifier = "allow-manage-flow-secrets"
description = "Allows writing/deleting flow script secrets to the OS credential store from the main window."
commands.allow = ["set_flow_secret", "delete_flow_secret"]

[[permission]]
identifier = "allow-is-left-mouse-pressed"
description = "Allows querying the physical left mouse button state for floating-window snap-after-drag on Windows."
commands.allow = ["is_left_mouse_pressed"]
