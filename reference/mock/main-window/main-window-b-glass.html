<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UFO Main — Scheme B Glass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: rgba(61, 61, 61, 0.8);
        --glass: rgba(255, 255, 255, 0.06);
        --glass-strong: rgba(255, 255, 255, 0.1);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #38bdf8;
        --accent-2: #818cf8;
        --accent-soft: rgba(56, 189, 248, 0.18);
        --danger: #fb7185;
        --input: rgba(15, 23, 42, 0.45);
        --ring: rgba(56, 189, 248, 0.65);
        --radius: 16px;
        --font: "Outfit", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.18), transparent 35%),
          radial-gradient(circle at 90% 0%, rgba(129, 140, 248, 0.16), transparent 30%),
          linear-gradient(160deg, #1a1a1a, #0f172a 55%, #111827);
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .frame {
        width: min(440px, 100%);
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .chrome {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--muted);
        font-size: 12px;
      }

      .traffic {
        display: flex;
        gap: 6px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      .dot.r {
        background: #fb7185;
      }
      .dot.y {
        background: #fbbf24;
      }
      .dot.g {
        background: #34d399;
      }

      .app {
        background: var(--bg);
        backdrop-filter: blur(22px) saturate(1.2);
        padding: 24px 20px 26px;
        display: grid;
        gap: 14px;
      }

      .hero {
        display: grid;
        gap: 8px;
        padding-bottom: 4px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
      }

      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
        max-width: 34em;
      }

      .card {
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        display: grid;
        gap: 14px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .card h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .label {
        font-size: 13px;
        font-weight: 500;
      }

      .hint {
        font-size: 11px;
        color: #94a3b8;
      }

      .pill-switch {
        position: relative;
        width: 48px;
        height: 28px;
        flex: 0 0 auto;
      }

      .pill-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .pill-switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: 180ms ease;
        cursor: pointer;
      }

      .pill-switch span::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: white;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        transition: 180ms ease;
      }

      .pill-switch input:checked + span {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
      }

      .pill-switch input:checked + span::after {
        transform: translateX(20px);
      }

      .pill-switch input:focus-visible + span {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field > span {
        font-size: 12px;
        color: #94a3b8;
      }

      .input {
        width: 100%;
        height: 40px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: var(--input);
        color: var(--text);
        padding: 0 16px;
        outline: none;
        font: inherit;
        transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
      }

      .input:hover {
        background: rgba(15, 23, 42, 0.55);
      }

      .input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .segment {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 6px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .chip {
        appearance: none;
        border: 0;
        border-radius: 10px;
        height: 34px;
        background: transparent;
        color: #cbd5e1;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: 150ms ease;
      }

      .chip:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .chip.active {
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(129, 140, 248, 0.25));
        color: white;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      .chip:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      .caps {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .btn-row {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 8px;
      }

      .btn {
        height: 40px;
        border-radius: 999px;
        border: 1px solid transparent;
        padding: 0 16px;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        font-size: 13px;
        transition: 150ms ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #0b1220;
        box-shadow: 0 10px 24px rgba(56, 189, 248, 0.22);
      }

      .btn-primary:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      .btn-ghost {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.12);
        color: var(--text);
      }

      .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .btn:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      .list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .item {
        display: grid;
        grid-template-columns: 12px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .status {
        width: 8px;
        height: 8px;
        border-radius: 999px;
      }

      .status.green {
        background: #34d399;
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.7);
      }

      .status.yellow {
        background: #fbbf24;
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.55);
      }

      .status.red {
        background: var(--danger);
        box-shadow: 0 0 12px rgba(251, 113, 133, 0.55);
      }

      .mono {
        font-variant-numeric: tabular-nums;
        color: #94a3b8;
        font-size: 12px;
      }

      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .scheme {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 12px;
        color: #e5e5e5;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="scheme">方案 B · Soft Glass · 柔和玻璃</div>
    <div class="frame" aria-label="Main window mock B">
      <div class="chrome">
        <div class="traffic">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        </div>
        <span>UFO · 主窗口</span>
        <span>connected</span>
      </div>
      <main class="app">
        <header class="hero">
          <div class="eyebrow">Live Monitor</div>
          <h1>悬浮窗设置</h1>
          <p class="sub">半透明玻璃卡片 + 胶囊控件。更轻、更现代，适合强调状态与氛围。</p>
        </header>

        <section class="card" aria-labelledby="modules-b">
          <div class="title-row">
            <h2 id="modules-b">悬浮窗模块</h2>
            <span class="hint">配置即时同步</span>
          </div>

          <div class="row">
            <div>
              <div class="label">Agent 状态灯</div>
              <div class="hint">在悬浮窗显示会话指示灯</div>
            </div>
            <label class="pill-switch">
              <input type="checkbox" checked />
              <span></span>
            </label>
          </div>

          <label class="field">
            <span>完成灯保留（秒）</span>
            <input class="input" type="number" value="30" min="1" max="86400" />
          </label>

          <div>
            <div class="field" style="margin-bottom: 8px">
              <span>当前编辑形态</span>
            </div>
            <div class="segment" role="tablist" aria-label="形态切换">
              <button class="chip active" type="button">方形</button>
              <button class="chip" type="button">四角</button>
              <button class="chip" type="button">横条</button>
              <button class="chip" type="button">竖条</button>
            </div>
          </div>

          <div class="caps">
            <label class="field">
              <span>格子上限</span>
              <input class="input" type="number" value="8" min="4" max="8" />
            </label>
            <label class="field">
              <span>预览格数</span>
              <input class="input" type="number" value="4" min="1" max="8" disabled />
            </label>
          </div>

          <div class="btn-row">
            <button class="btn btn-ghost" type="button">重置</button>
            <button class="btn btn-primary" type="button">保存设置</button>
          </div>
        </section>

        <section class="card" aria-labelledby="sessions-b">
          <div class="title-row">
            <h2 id="sessions-b">Agent 会话</h2>
            <span class="hint">3 live</span>
          </div>
          <ul class="list">
            <li class="item">
              <span class="status green"></span>
              <span>claude · a1b2c3d4e5f6</span>
              <span class="mono">running</span>
            </li>
            <li class="item">
              <span class="status yellow"></span>
              <span>claude · 9f8e7d6c5b4a</span>
              <span class="mono">waiting</span>
            </li>
            <li class="item">
              <span class="status red"></span>
              <span>codex · 112233445566</span>
              <span class="mono">error</span>
            </li>
          </ul>
        </section>
      </main>
    </div>
  </body>
</html>
