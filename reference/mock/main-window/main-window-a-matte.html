<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UFO Main — Scheme A Matte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: rgba(61, 61, 61, 0.8);
        --surface: #2a2a2a;
        --surface-2: #323232;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #f3f4f6;
        --muted: #a3a3a3;
        --accent: #34d399;
        --accent-soft: rgba(52, 211, 153, 0.16);
        --danger: #f87171;
        --input: #1f1f1f;
        --ring: rgba(52, 211, 153, 0.55);
        --radius: 12px;
        --font: "Plus Jakarta Sans", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(circle at top left, #4a4a4a 0%, #1c1c1c 55%),
          #141414;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .frame {
        width: min(420px, 100%);
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      .chrome {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #242424;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        color: var(--muted);
        font-size: 12px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #525252;
      }

      .app {
        background: var(--bg);
        backdrop-filter: blur(18px);
        padding: 22px 20px 24px;
        display: grid;
        gap: 16px;
      }

      .hero {
        display: grid;
        gap: 6px;
      }

      .badge {
        width: fit-content;
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        display: grid;
        gap: 12px;
      }

      .card h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: #e5e5e5;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .label {
        font-size: 13px;
        color: var(--text);
      }

      .hint {
        font-size: 11px;
        color: var(--muted);
      }

      .switch {
        position: relative;
        width: 42px;
        height: 24px;
        flex: 0 0 auto;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #404040;
        border: 1px solid var(--border-strong);
        transition: 160ms ease;
        cursor: pointer;
      }

      .switch span::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #f5f5f5;
        transition: 160ms ease;
      }

      .switch input:checked + span {
        background: var(--accent);
        border-color: transparent;
      }

      .switch input:checked + span::after {
        transform: translateX(18px);
      }

      .switch input:focus-visible + span {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field span {
        font-size: 12px;
        color: var(--muted);
      }

      .input,
      .btn {
        font: inherit;
      }

      .input {
        width: 100%;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--border-strong);
        background: var(--input);
        color: var(--text);
        padding: 0 12px;
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      .input:hover {
        border-color: rgba(255, 255, 255, 0.22);
      }

      .input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .btn {
        height: 36px;
        border-radius: 10px;
        border: 1px solid transparent;
        padding: 0 14px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: 150ms ease;
      }

      .btn-primary {
        background: var(--accent);
        color: #052e1d;
      }

      .btn-primary:hover {
        filter: brightness(1.05);
      }

      .btn-ghost {
        background: transparent;
        border-color: var(--border-strong);
        color: var(--text);
      }

      .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .btn:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .item {
        display: grid;
        grid-template-columns: 10px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--surface-2);
        border: 1px solid var(--border);
      }

      .status {
        width: 8px;
        height: 8px;
        border-radius: 999px;
      }

      .status.green {
        background: #34d399;
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18);
      }

      .status.yellow {
        background: #fbbf24;
      }

      .status.red {
        background: var(--danger);
      }

      .mono {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 12px;
      }

      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .scheme {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 12px;
        color: #e5e5e5;
      }
    </style>
  </head>
  <body>
    <div class="scheme">方案 A · Matte Panel · 哑光控制台</div>
    <div class="frame" aria-label="Main window mock A">
      <div class="chrome">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span>UFO · 主窗口</span>
      </div>
      <main class="app">
        <header class="hero">
          <div class="badge">Agent Status</div>
          <h1>悬浮窗设置</h1>
          <p class="sub">深色哑光面板。开关、数字输入、主次按钮对比清晰，适合日常配置。</p>
        </header>

        <section class="card" aria-labelledby="modules-a">
          <div class="title-row">
            <h2 id="modules-a">悬浮窗模块</h2>
            <span class="hint">即时生效</span>
          </div>

          <div class="row">
            <div>
              <div class="label">Agent 状态灯</div>
              <div class="hint">在悬浮窗显示会话指示灯</div>
            </div>
            <label class="switch">
              <input type="checkbox" checked />
              <span></span>
            </label>
          </div>

          <label class="field">
            <span>完成灯保留（秒）</span>
            <input class="input" type="number" value="30" min="1" max="86400" />
          </label>

          <div class="grid-2">
            <label class="field">
              <span>方形上限</span>
              <input class="input" type="number" value="8" min="4" max="8" />
            </label>
            <label class="field">
              <span>四角上限</span>
              <input class="input" type="number" value="8" min="4" max="8" />
            </label>
            <label class="field">
              <span>横条上限</span>
              <input class="input" type="number" value="8" min="4" max="8" />
            </label>
            <label class="field">
              <span>竖条上限</span>
              <input class="input" type="number" value="8" min="4" max="8" />
            </label>
          </div>

          <div class="actions">
            <button class="btn btn-ghost" type="button">重置</button>
            <button class="btn btn-primary" type="button">保存</button>
          </div>
        </section>

        <section class="card" aria-labelledby="sessions-a">
          <div class="title-row">
            <h2 id="sessions-a">Agent 会话</h2>
            <span class="hint">3 个活跃</span>
          </div>
          <ul class="list">
            <li class="item">
              <span class="status green"></span>
              <span>claude · a1b2c3d4e5f6</span>
              <span class="mono">running</span>
            </li>
            <li class="item">
              <span class="status yellow"></span>
              <span>claude · 9f8e7d6c5b4a</span>
              <span class="mono">waiting</span>
            </li>
            <li class="item">
              <span class="status red"></span>
              <span>codex · 112233445566</span>
              <span class="mono">error</span>
            </li>
          </ul>
        </section>
      </main>
    </div>
  </body>
</html>
