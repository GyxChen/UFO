<?xml version="1.0" encoding="UTF-8"?>
<!--
  小旗子图标（悬浮窗三档优先级指示点用的字形）。

  ⚠️ 这份 SVG 只画**形状**，不带颜色语义：颜色由 CSS 用 mask-image + background-color
  决定（红 = 高优先级 / 黄 = 中 / 蓝 = 低，见 src/modules/todo/todo.css）。
  因此这里填什么色都不影响观感，但必须**完全不透明** —— mask 取的是 alpha 通道，
  半透明的地方在界面上就是缺一块。
  ⚠️ viewBox 必须**紧贴字形**（12×14，即 6:7）：CSS 侧的宽高就是按这个比例写死的，
  留白会让图标在盒子里缩一圈，改这里也要同步改 todo.css 里那个旗子高度变量。
  ⚠️ 注释里**不许出现连续两个减号**（XML 注释的硬性语法）：写 CSS 变量名时会被当成
  注释提前结束，整份 SVG 解析失败 → 旗子整片不显示。要提就用别的写法绕开。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 14" width="12" height="14">
  <!-- 旗杆：从旗面一路垂到底，圆头收口（两端各外扩半个描边，正好顶满 0~14） -->
  <path d="M0.7 0.7V13.3" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" />
  <!-- 旗面：一条飘动的缎带（上下两条边同相起伏，于是宽度处处一致） -->
  <path
    d="M1 1.5c1.8-.6 3.7-.6 5.5 0c1.8.6 3.7.6 5.5 0v4.8c-1.8.6-3.7.6-5.5 0c-1.8-.6-3.7-.6-5.5 0z"
    fill="#fff"
  />
</svg>
